<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- The hero stage's surface grain (HOME-ATMOSPHERE, 2026-10-31): a tileable
       monochrome noise the band repeats under its lighting (globals.css
       `.home-band::after`), so the stage reads as a lit, textured surface
       rather than a flat gradient at any resolution. Opacity and blend live in
       the CSS; this file only carries the noise. -->
  <filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" seed="7" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="1" />
    </feComponentTransfer>
  </filter>
  <rect width="240" height="240" filter="url(#g)" />
</svg>
