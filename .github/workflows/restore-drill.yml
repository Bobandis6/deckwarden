name: Restore drill

# P1.8's "restore tested once" — repeatable on demand. Downloads the LATEST
# user-table dump + identity map from R2 and restores into a throwaway
# Postgres 17, proving the backup artifacts alone can bring decks back.
#
# Expected noise: the dump carries FK constraints to card/reference tables
# that a scratch DB doesn't have (games, formats, card_identities,
# card_printings) — those ALTERs fail by design and are allowlisted; data
# still loads. Real-disaster order is: new DB → migrate → re-ingest →
# restore user tables → remap deck identity refs via the identity map
# (external_key = scryfall oracle_id survives a rebuild; identity uuids don't).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCRATCH_URL: postgresql://postgres:drill@localhost:5432/drill
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      # Same version dance as the nightly backup: runner default psql is 16.
      - name: Install Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Download latest dump + identity map from R2
        run: |
          set -euo pipefail
          LATEST=$(aws s3 ls "s3://${{ secrets.R2_BUCKET }}/pg/" --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            | awk '{print $4}' | grep '^deckwarden-user-tables-' | sort | tail -1)
          [ -n "$LATEST" ] || { echo "no dump found in bucket"; exit 1; }
          STAMP=${LATEST#deckwarden-user-tables-}; STAMP=${STAMP%.sql.gz}
          MAP="deckwarden-identity-map-$STAMP.csv.gz"
          echo "restoring $LATEST (+ $MAP)"
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/pg/$LATEST" dump.sql.gz --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/pg/$MAP" map.csv.gz --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          # Account links (P2.8): same-stamp CSV of accounts' identity columns.
          # Missing only when the newest backup predates P2.8 — tolerate that
          # one gap so the drill stays runnable, but say so loudly.
          LINKS="deckwarden-account-links-$STAMP.csv.gz"
          if aws s3 cp "s3://${{ secrets.R2_BUCKET }}/pg/$LINKS" links.csv.gz --endpoint-url "${{ secrets.R2_ENDPOINT }}"; then
            echo "got $LINKS"
          else
            echo "::warning::no account-links CSV for stamp $STAMP (backup predates P2.8?)"
          fi

      - name: Restore dump into scratch Postgres
        run: |
          set -euo pipefail
          gunzip -c dump.sql.gz | psql "$SCRATCH_URL" -v ON_ERROR_STOP=0 2>restore-err.log || true
          # Only FKs to tables that live outside the backup may fail.
          if grep '^ERROR' restore-err.log | grep -Ev 'relation "(public\.)?(games|formats|card_identities|card_printings|users)" does not exist'; then
            echo "unexpected restore errors above"; exit 1
          fi
          echo "expected (allowlisted) errors:"; grep -c '^ERROR' restore-err.log || true

      - name: Verify restored data + identity-map coverage
        run: |
          set -euo pipefail
          psql "$SCRATCH_URL" -c "CREATE TABLE identity_map (id uuid PRIMARY KEY, game_id smallint, external_key text)"
          gunzip -c map.csv.gz | psql "$SCRATCH_URL" -c "\copy identity_map FROM STDIN WITH (FORMAT csv, HEADER)"
          DECKS=$(psql "$SCRATCH_URL" -Atc "SELECT count(*) FROM decks")
          CARDS=$(psql "$SCRATCH_URL" -Atc "SELECT count(*) FROM deck_cards")
          MAPPED=$(psql "$SCRATCH_URL" -Atc "SELECT count(*) FROM identity_map")
          # Identity refs: deck_cards, the leader_ids denorm, and (Y9a) the
          # cardIds frozen inside deck_versions.cards — a version restored
          # into a rebuilt corpus needs the same remap as the live list.
          DANGLING=$(psql "$SCRATCH_URL" -Atc "
            SELECT (SELECT count(*) FROM deck_cards dc LEFT JOIN identity_map m ON m.id = dc.card_identity_id WHERE m.id IS NULL)
                 + (SELECT count(*) FROM (SELECT unnest(leader_ids) AS lid FROM decks) l LEFT JOIN identity_map m ON m.id = l.lid WHERE m.id IS NULL)
                 + (SELECT count(*) FROM (SELECT (c->>'cardId')::uuid AS cid FROM deck_versions v, jsonb_array_elements(v.cards) c) f LEFT JOIN identity_map m ON m.id = f.cid WHERE m.id IS NULL)")
          echo "restored: $DECKS deck(s), $CARDS deck_cards row(s); identity map: $MAPPED ids; dangling refs: $DANGLING"
          # Aggregates only (S1, SECURITY-AUDIT-report.md M2): this log is
          # world-readable, so no deck name, id or public_id is ever printed —
          # decks and card rows per kind and visibility, then the card-count
          # spread over the restored decks.
          psql "$SCRATCH_URL" -c "
            SELECT d.kind, d.visibility, count(*) AS decks,
                   coalesce(sum(c.cards), 0) AS cards,
                   count(*) FILTER (WHERE c.cards IS NULL) AS empty_decks
              FROM decks d
              LEFT JOIN (SELECT deck_id, count(*) AS cards FROM deck_cards GROUP BY deck_id) c ON c.deck_id = d.id
             GROUP BY d.kind, d.visibility
             ORDER BY d.kind, d.visibility"
          psql "$SCRATCH_URL" -c "
            SELECT min(cards) AS min_cards, round(avg(cards), 1) AS avg_cards, max(cards) AS max_cards
              FROM (SELECT count(*) AS cards FROM deck_cards GROUP BY deck_id) c"
          [ "$DECKS" -ge 1 ] || { echo "FAIL: no decks restored"; exit 1; }
          [ "$CARDS" -ge 1 ] || { echo "FAIL: no deck_cards restored"; exit 1; }
          [ "$DANGLING" = "0" ] || { echo "FAIL: deck rows reference ids missing from the identity map"; exit 1; }
          # The game journal (Y9a, 0018): every game's deck restored, and every
          # version a game names present in that deck's history (no FK — a
          # played snapshot goes only with its last game). Opponents are
          # external keys and need no map. Dumps from before 0018 have no table.
          if [ "$(psql "$SCRATCH_URL" -Atc "SELECT to_regclass('public.deck_games') IS NOT NULL")" = "t" ]; then
            GAMES=$(psql "$SCRATCH_URL" -Atc "SELECT count(*) FROM deck_games")
            GAME_DANGLING=$(psql "$SCRATCH_URL" -Atc "
              SELECT (SELECT count(*) FROM deck_games g LEFT JOIN decks d ON d.id = g.deck_id WHERE d.id IS NULL)
                   + (SELECT count(*) FROM deck_games g WHERE g.version IS NOT NULL AND NOT EXISTS (
                        SELECT 1 FROM deck_versions v WHERE v.deck_id = g.deck_id AND v.version = g.version))")
            echo "deck_games: $GAMES game(s); dangling deck/version refs: $GAME_DANGLING"
            [ "$GAME_DANGLING" = "0" ] || { echo "FAIL: logged games reference a missing deck or version"; exit 1; }
          else
            echo "deck_games absent from this dump (taken before migration 0018) — journal check skipped"
          fi
          echo "restore drill PASSED"

      - name: Verify account-links CSV loads and covers restored users
        run: |
          set -euo pipefail
          if [ ! -f links.csv.gz ]; then
            echo "skipped — no account-links CSV in this backup stamp (see warning above)"
            exit 0
          fi
          psql "$SCRATCH_URL" -c "CREATE TABLE account_links (issuer text, account_id text, provider_id text, user_id uuid)"
          gunzip -c links.csv.gz | psql "$SCRATCH_URL" -c "\copy account_links FROM STDIN WITH (FORMAT csv, HEADER)"
          LINKS_N=$(psql "$SCRATCH_URL" -Atc "SELECT count(*) FROM account_links")
          # Every restored user must have at least one OAuth link, or a real
          # restore locks them out (OAuth-only site — no password fallback).
          UNLINKED=$(psql "$SCRATCH_URL" -Atc "
            SELECT count(*) FROM users u WHERE NOT EXISTS (
              SELECT 1 FROM account_links l WHERE l.user_id = u.id)")
          echo "account links: $LINKS_N row(s); restored users without a link: $UNLINKED"
          [ "$UNLINKED" = "0" ] || { echo "FAIL: restored users would be locked out (no OAuth link)"; exit 1; }
          echo "account-links check PASSED"
