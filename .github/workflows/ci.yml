name: CI

on:
  push:
    branches: [main]
  pull_request:

# S7 (SECURITY-AUDIT-report.md L18): the job reads the tree and runs `pnpm
# check` — nothing writes. The repository's default token is read-only
# already (Settings → Actions → General); this block keeps the job there
# whatever that setting does, and a test pins the block.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
