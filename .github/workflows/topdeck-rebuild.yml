name: Rebuild tournament aggregate

# LATER rows 36 and 296: replaces commander_card_stats and commander_stats with
# the settled competitive events of a fresh 180 days from Topdeck, which prunes
# everything older. It writes to production, so it runs only when someone starts
# it. The Topdeck step is the nightly's own code over a longer window, and it
# leaves the raw chunks the rebuild reads; the archive step then keeps them in
# R2. The nightly's concurrency group means the two can't overlap. A failure at
# any step leaves the aggregate as it was: the replacement is one transaction.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ingest

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - name: Re-fetch 180 days from Topdeck (merges events, leaves the raw chunks)
        timeout-minutes: 25
        run: pnpm ingest:topdeck
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
          TOPDECK_WINDOW_DAYS: "180"

      - name: Replace the aggregate from those chunks
        timeout-minutes: 10
        run: pnpm tsx scripts/ingest/topdeck-aggregate-backfill.ts .topdeck-raw --rebuild
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Archive the raw chunks to R2
        timeout-minutes: 15
        if: ${{ !cancelled() }}
        run: bash scripts/archive-topdeck-raw.sh
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Database size gauge
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: pnpm db:size
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
