name: Nightly ingest

on:
  schedule:
    # Daily, after Scryfall regenerates bulk data (observed ~09:05 UTC).
    - cron: "37 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # keepalive step re-enables this workflow

concurrency:
  group: nightly-ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Ingest Scryfall (also the Neon keepalive — daily activity prevents idle pause)
        run: pnpm ingest:scryfall
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest Commander Spellbook combos (after Scryfall — pieces resolve via oracle_id)
        run: pnpm ingest:spellbook
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Skips loudly while the TOPDECK_API_KEY secret is unset (dormant deploy);
      # with the key, any error is a hard fail like the sibling steps.
      - name: Ingest Topdeck tournament results (after the card jobs — commanders resolve via name_norm)
        run: pnpm ingest:topdeck
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}

      - name: Archive raw Topdeck responses to R2 (no-op when dormant)
        run: bash scripts/archive-topdeck-raw.sh
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Database size gauge (fails over 350MB — the alert channel)
        run: pnpm db:size
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Purge stale anonymous decks (dry-run until the PURGE_ANON_DECKS_APPLY repo variable is "true")
        run: pnpm decks:purge
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PURGE_APPLY: ${{ vars.PURGE_ANON_DECKS_APPLY }}

      # Runner default pg_dump is v16 and refuses Neon's v17 server. The pgdg apt
      # repo isn't configured on ubuntu-latest, so add it first. The runner also
      # has a local Postgres 16 cluster, which makes Debian's pg_wrapper resolve
      # `pg_dump` to 16 even with 17 installed — put 17's real binaries on PATH.
      - name: Install Postgres 17 client for pg_dump
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Back up user tables to R2 (no-op until R2 secrets are configured)
        run: bash scripts/backup-user-tables.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Workflow keepalive (GitHub disables idle scheduled workflows after 60 days)
        if: always()
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-ingest.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
