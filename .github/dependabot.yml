# S0 (SECURITY-AUDIT-report.md L18, half): Dependabot version updates for the
# npm tree — one weekly pull request with every minor and patch bump grouped,
# so the lockfile moves in one reviewed step instead of a dozen. Majors stay
# their own pull requests (the working agreement: one major per package, with
# `pnpm check` and a prod smoke each — LATER.md row 270).
#
# This file configures VERSION updates only. Dependabot ALERTS and SECURITY
# updates are repository settings (Settings → Advanced Security → Dependabot),
# which no file in the repository can turn on — the owner enables them in the
# GitHub UI; `gh api repos/Bobandis6/deckwarden/vulnerability-alerts` answers
# 204 once they are on (404 on 2026-10-18).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # @types/node follows the Node runtime, not the registry: ci.yml and the
    # nightly run `node-version: 22`, so its majors wait for a runtime move and
    # come with it (the owner closed #4, 20.x → 26.x, on 2026-10-23; the next
    # dependency package moved it to 22.x on 2026-10-24). Its minors and
    # patches still arrive in the group below.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # S7 (SECURITY-AUDIT-report.md L18, the other half): the workflows pin
  # every action to a full commit SHA with its version in a trailing comment,
  # and a SHA never moves on its own — this entry is what keeps the pins
  # current. Dependabot moves the SHA and the comment together; the same
  # weekly slot and the same grouping as the npm entry (minors and patches
  # in one pull request, a major on its own, read against the action's
  # release notes — a runner-side change, not a dependency of the app).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
